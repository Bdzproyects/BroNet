<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BroNet - Arquitectura Anas</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <link rel="manifest" href="/static/manifest.json">
    <link rel="icon" href="/static/logo.png" type="image/png">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #2c2f33; color: white; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        #sidebar { width: 240px; background: #23272a; padding: 20px; border-right: 1px solid #444; flex-shrink: 0; }
        #main { flex-grow: 1; padding: 20px; background: #36393f; display: flex; flex-direction: column; overflow-y: auto; }
        .tab-content { display: none; }
        .active { display: block; }
        .btn { background: #7289da; color: white; border: none; padding: 12px; border-radius: 5px; cursor: pointer; width: 100%; margin-bottom: 12px; font-weight: bold; }
        .btn-chat { background: #43b581; width: auto; padding: 5px 15px; }
        #chat-box { background: #2f3136; height: 450px; overflow-y: auto; padding: 15px; border-radius: 8px; border: 1px solid #444; margin-bottom: 15px; }
        input, textarea { width: 100%; padding: 12px; background: #40444b; color: white; border: none; border-radius: 5px; box-sizing: border-box; margin-bottom: 10px; }
        .profile-img { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 3px solid #7289da; }
        #login-overlay { position: fixed; inset: 0; background: #23272a; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="login-overlay">
    <h2 style="color: #7289da;">📡 Bienvenido a BroNet</h2>
    <div style="width: 320px;">
        <input type="text" id="u-in" placeholder="Usuario o Correo">
        <input type="text" id="e-in" placeholder="Email @gmail.com (Solo si eres nuevo)">
        <input type="password" id="p-in" placeholder="Contraseña">
        <button onclick="login()" class="btn" style="background: #43b581;">ENTRAR / REGISTRARSE</button>
    </div>
</div>

<div id="sidebar">
    <div style="text-align:center; margin-bottom:20px; padding:10px; background:#2f3136; border-radius:10px;">
        <img id="my-pic" src="/static/logo.png" class="profile-img" style="width:60px; height:60px;">
        <p id="my-name" style="font-weight:bold; margin-top:5px;">Cargando...</p>
    </div>
    <button class="btn" onclick="showTab('perfil')">👤 Mi Perfil</button>
    <button class="btn" onclick="showTab('bros')">👥 Buscar Bros</button>
    <button class="btn" onclick="showTab('chat')">💬 Chat Activo</button>
    <button class="btn" onclick="showTab('brols')">🔥 Brols</button>
</div>

<div id="main">
    <!-- Mi Perfil -->
    <div id="perfil-tab" class="tab-content active">
        <h3>Configurar mi Perfil</h3>
        <input type="file" id="file-pic">
        <textarea id="bio-in" rows="4" placeholder="Cuéntale algo a tus Bros..."></textarea>
        <button class="btn" onclick="updateProfile()" style="background:#43b581;">Guardar Cambios</button>
    </div>

    <!-- Lista de Bros -->
    <div id="bros-tab" class="tab-content">
        <h3>Bros en línea</h3>
        <div id="u-list"></div>
    </div>

    <!-- Chat -->
    <div id="chat-tab" class="tab-content">
        <h3 id="c-title">Selecciona un Bro</h3>
        <div id="chat-box"></div>
        <input type="text" id="m-in" placeholder="Mensaje seguro...">
    </div>

    <!-- Brols -->
    <div id="brols-tab" class="tab-content">
        <h3>🔥 Brols - Tendencias</h3>
        <div id="v-list"></div>
    </div>
</div>

<script>
    const socket = io();
    let me = {}, target = "";

    async function login() {
        const u = document.getElementById('u-in').value;
        const e = document.getElementById('e-in').value;
        const p = document.getElementById('p-in').value;
        const res = await fetch('/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username: u, email: e, password: p})
        });
        const data = await res.json();
        if(res.ok) {
            me = data.user;
            document.getElementById('login-overlay').classList.add('hidden');
            document.getElementById('my-name').innerText = me.username;
            document.getElementById('my-pic').src = me.pic;
            document.getElementById('bio-in').value = me.bio;
        } else { alert(data.msg); }
    }

    async function updateProfile() {
        const fd = new FormData();
        fd.append('username', me.username);
        fd.append('bio', document.getElementById('bio-in').value);
        const fileIn = document.getElementById('file-pic');
        if(fileIn.files) fd.append('file', fileIn.files);
        
        const res = await fetch('/update_profile', { method: 'POST', body: fd });
        const data = await res.json();
        if(res.ok) {
            me = data.user;
            document.getElementById('my-pic').src = me.pic;
            alert("Perfil blindado, Bro.");
        }
    }

    async function loadUsers() {
        const res = await fetch('/get_users');
        const users = await res.json();
        document.getElementById('u-list').innerHTML = users.filter(u => u !== me.username).map(u => 
            `<div style="display:flex; justify-content:space-between; margin-bottom:10px; padding:10px; background:#2f3136; border-radius:5px;">
                <span>👤 ${u}</span>
                <button class="btn btn-chat" onclick="startChat('${u}')">Chat</button>
            </div>`
        ).join('') || "<p>No hay más bros registrados.</p>";
    }

    async function startChat(u) {
        target = u;
        document.getElementById('c-title').innerText = "🔒 Chat Privado con " + u;
        const res = await fetch('/get_history', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({user: me.username, target: u})
        });
        const history = await res.json();
        document.getElementById('chat-box').innerHTML = history.map(m => `<p><strong>${m.user}:</strong> ${m.msg}</p>`).join('');
        socket.emit('join_private', {user: me.username, target: u});
        showTab('chat');
    }

    socket.on('new_msg', data => {
        const box = document.getElementById('chat-box');
        box.innerHTML += `<p><strong>${data.user}:</strong> ${data.msg}</p>`;
        box.scrollTop = box.scrollHeight;
    });

    document.getElementById('m-in').onkeypress = (e) => {
        if(e.key === 'Enter' && e.target.value.trim()) {
            socket.emit('send_msg', {user: me.username, target: target, msg: e.target.value});
            e.target.value = "";
        }
    };

    async function loadBrols() {
        const res = await fetch('/get_brols');
        const brols = await res.json();
        document.getElementById('v-list').innerHTML = brols.map(v => 
            `<div style="margin-bottom:30px; background:#202225; padding:20px; border-radius:10px;">
                <p><strong>${v.title}</strong></p>
                <video width="100%" controls src="${v.url}" style="border-radius:10px; max-height:450px;"></video>
            </div>`
        ).join('');
    }

    function showTab(t) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.getElementById(t + '-tab').classList.add('active');
        if(t === 'bros') loadUsers();
        if(t === 'brols') loadBrols();
    }
</script>
</body>
</html>
