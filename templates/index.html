<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BroNet - Red Social Privada</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <!-- Conexión con PWA y el Icono de Fuerza [812, Historial] -->
    <link rel="manifest" href="/static/manifest.json">
    <link rel="icon" href="/static/logo.png" type="image/png">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #2c2f33; color: white; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        #sidebar { width: 230px; background: #23272a; padding: 20px; border-right: 1px solid #444; flex-shrink: 0; }
        #main { flex-grow: 1; padding: 20px; background: #36393f; display: flex; flex-direction: column; position: relative; }
        .tab-content { display: none; flex-grow: 1; overflow-y: auto; }
        .active { display: block; }
        .btn { background: #7289da; color: white; border: none; padding: 12px; border-radius: 5px; cursor: pointer; width: 100%; margin-bottom: 12px; font-weight: bold; }
        .btn:hover { background: #5b6eae; }
        .btn-chat { background: #43b581; width: auto; padding: 5px 15px; margin-left: 10px; }
        #chat-box { background: #2f3136; height: 70%; overflow-y: auto; padding: 15px; border-radius: 8px; border: 1px solid #444; margin-bottom: 15px; }
        input { width: 100%; padding: 12px; background: #40444b; color: white; border: none; border-radius: 5px; box-sizing: border-box; margin-bottom: 10px; }
        .msg { margin: 8px 0; border-bottom: 1px solid #333; padding-bottom: 5px; }
        #login-overlay { position: fixed; inset: 0; background: #23272a; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="login-overlay">
    <h2 style="color: #7289da;">📡 Acceso a BroNet</h2>
    <div style="width: 320px;">
        <input type="text" id="u-in" placeholder="Usuario o Correo">
        <input type="text" id="e-in" placeholder="Email (Solo si eres nuevo)">
        <input type="password" id="p-in" placeholder="Contraseña">
        <button onclick="login()" class="btn" style="background: #43b581;">ENTRAR / REGISTRARSE</button>
    </div>
</div>

<div id="sidebar">
    <h2 style="text-align: center;">BroNet</h2>
    <hr style="border: 0.5px solid #444; margin-bottom: 20px;">
    <button class="btn" onclick="showTab('perfil')">👥 Mis Bros</button>
    <button class="btn" onclick="showTab('chat')">💬 Chat Privado</button>
    <button class="btn" onclick="showTab('brols')">🔥 Brols</button>
</div>

<div id="main">
    <div id="perfil-tab" class="tab-content active">
        <h3>Lista de Bros Registrados</h3>
        <div id="u-list" style="background: #202225; padding: 15px; border-radius: 10px;"></div>
        <hr style="margin: 25px 0; border: 0.5px solid #444;">
        <h3>🛡️ Desintegrador de Virus</h3>
        <p>Sube archivos para analizarlos antes de compartirlos.</p>
        <input type="file" id="file-in">
        <button class="btn" onclick="upload()" style="width: auto; background: #43b581; margin-top: 10px;">Escanear y Subir</button>
        <p id="up-status" style="font-weight: bold;"></p>
    </div>

    <div id="chat-tab" class="tab-content">
        <h3 id="c-title">Chat Privado</h3>
        <div id="chat-box"></div>
        <input type="text" id="m-in" placeholder="Escribe tu mensaje secreto...">
    </div>

    <div id="brols-tab" class="tab-content">
        <h3>🔥 Brols - Videos Tendencia</h3>
        <div id="v-list"></div>
    </div>
</div>

<script>
    const socket = io();
    let me = "", target = "";

    async function login() {
        const u = document.getElementById('u-in').value;
        const e = document.getElementById('e-in').value;
        const p = document.getElementById('p-in').value;
        if(!u || !p) return alert("Pon el usuario/correo y la clave");

        const res = await fetch('/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username: u, email: e, password: p})
        });
        const data = await res.json();
        if(res.ok) {
            me = data.user;
            document.getElementById('login-overlay').classList.add('hidden');
            loadUsers();
        } else {
            alert("Error: " + data.msg);
        }
    }

    async function loadUsers() {
        const res = await fetch('/get_users');
        const users = await res.json();
        document.getElementById('u-list').innerHTML = users.filter(u => u !== me).map(u => 
            `<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                <span>👤 ${u}</span>
                <button class="btn btn-chat" onclick="startChat('${u}')">Chatear</button>
            </div>`
        ).join('') || "<p>No hay más bros todavía.</p>";
    }

    function startChat(u) {
        target = u;
        document.getElementById('c-title').innerText = "🔒 Conexión Segura con " + u;
        document.getElementById('chat-box').innerHTML = "<p><i>Cifrado punto a punto activo.</i></p>";
        socket.emit('join_private', {user: me, target: u});
        showTab('chat');
    }

    socket.on('new_msg', data => {
        const box = document.getElementById('chat-box');
        box.innerHTML += `<p class="msg"><strong>${data.user}:</strong> ${data.msg}</p>`;
        box.scrollTop = box.scrollHeight;
    });

    document.getElementById('m-in').onkeypress = (e) => {
        if(e.key === 'Enter' && e.target.value.trim() !== "") {
            if(!target) return alert("Elige un bro de la lista");
            socket.emit('send_msg', {user: me, target: target, msg: e.target.value});
            e.target.value = "";
        }
    };

    async function upload() {
        const file = document.getElementById('file-in').files;
        if(!file) return alert("Selecciona un archivo");
        const fd = new FormData();
        fd.append('file', file);
        document.getElementById('up-status').innerText = "Analizando con ClamAV...";
        const res = await fetch('/upload_profile', { method: 'POST', body: fd });
        const data = await res.json();
        document.getElementById('up-status').innerText = data.msg;
    }

    function showTab(t) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.getElementById(t + '-tab').classList.add('active');
        if(t === 'perfil') loadUsers();
        if(t === 'brols') loadBrols();
    }

    async function loadBrols() {
        const res = await fetch('/get_brols');
        const brols = await res.json();
        document.getElementById('v-list').innerHTML = brols.map(v => 
            `<div style="margin-bottom:20px; background:#202225; padding:15px; border-radius:10px;">
                <p><strong>${v.title}</strong></p>
                <video width="100%" controls src="${v.url}" style="border-radius:5px;"></video>
            </div>`
        ).join('');
    }
</script>
</body>
</html>
