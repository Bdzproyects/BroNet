<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BroNet - Arquitectura Anas</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #2c2f33; color: white; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        #sidebar { width: 200px; background-color: #23272a; padding: 20px; border-right: 1px solid #444; flex-shrink: 0; }
        #main-content { flex-grow: 1; padding: 20px; display: flex; flex-direction: column; background-color: #36393f; }
        .tab-button { display: block; width: 100%; padding: 12px; margin-bottom: 10px; background: #7289da; border: none; color: white; cursor: pointer; border-radius: 5px; text-align: left; font-weight: bold; }
        .tab-button:hover { background: #5b6eae; }
        #chat-area { flex-grow: 1; overflow-y: auto; background: #2f3136; padding: 15px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #444; }
        #message-input { width: 100%; padding: 15px; border-radius: 5px; border: none; background: #40444b; color: white; box-sizing: border-box; }
        .hidden { display: none; }
        .msg-line { margin: 5px 0; border-bottom: 1px solid #333; padding-bottom: 2px; }
    </style>
</head>
<body>

<!-- Pantalla de Login (Paso A) -->
<div id="login-overlay" style="position:fixed; top:0; left:0; width:100%; height:100%; background:#23272a; z-index:1000; display:flex; flex-direction:column; align-items:center; justify-content:center;">
    <h1 style="color: #7289da;">📡 Conectar a BroNet</h1>
    <p>Introduce tus credenciales de Arquitecto</p>
    <input type="text" id="user-login" placeholder="Usuario" style="padding:12px; margin:5px; border-radius:5px; border:none; width: 250px;">
    <input type="password" id="pass-login" placeholder="Contraseña" style="padding:12px; margin:5px; border-radius:5px; border:none; width: 250px;">
    <button onclick="doLogin()" style="padding:12px 25px; margin-top:15px; background:#43b581; color:white; border:none; border-radius:5px; cursor:pointer; font-weight:bold;">ENTRAR / REGISTRARSE</button>
</div>

<div id="sidebar">
    <h2 style="text-align:center;">BroNet</h2>
    <hr style="border: 0.5px solid #444;">
    <button class="tab-button" onclick="showTab('chat')">💬 Chat Principal</button>
    <button class="tab-button" onclick="showTab('brols')">🔥 Brols (Videos)</button>
    <button class="tab-button" onclick="showTab('perfil')">👤 Mi Perfil</button>
</div>

<div id="main-content">
    <!-- Pestaña Chat -->
    <div id="chat-tab" class="tab-content">
        <h3># general</h3>
        <div id="chat-area">
            <p class="msg-line"><strong>Root:</strong> Sistema de broadcast activo. Esperando paquetes... [Historial]</p>
        </div>
        <input type="text" id="message-input" placeholder="Escribe un mensaje y pulsa Enter...">
    </div>

    <!-- Pestaña Brols -->
    <div id="brols-tab" class="tab-content hidden">
        <h3>🔥 Brols - Tendencias</h3>
        <div style="background:#202225; padding:20px; border-radius:10px; text-align:center;">
            <p>Módulo de carga de videos cortos en desarrollo...</p>
            <progress value="20" max="100"></progress>
        </div>
    </div>

    <!-- Pestaña Perfil -->
    <div id="perfil-tab" class="tab-content hidden">
        <h3>👤 Perfil de Usuario</h3>
        <div id="perfil-info"></div>
    </div>
</div>

<script>
    const socket = io();
    const chatArea = document.getElementById('chat-area');
    const input = document.getElementById('message-input');
    let currentUser = "";

    // 1. Lógica de Login (POST Request) [1, 2]
    async function doLogin() {
        const user = document.getElementById('user-login').value;
        const pass = document.getElementById('pass-login').value;
        
        if (!user || !pass) return alert("Rellena los campos, bro");

        const response = await fetch('/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username: user, password: pass})
        });
        const resData = await response.json();
        
        if(resData.status) {
            currentUser = resData.user;
            document.getElementById('login-overlay').style.display = 'none';
            document.getElementById('perfil-info').innerHTML = `<h4>Arquitecto: ${currentUser}</h4>`;
        }
    }

    // 2. Escuchar mensajes (Broadcast) [Historial]
    socket.on('message', (data) => {
        const p = document.createElement('p');
        p.className = 'msg-line';
        p.innerHTML = `<strong>${data.user}:</strong> ${data.msg}`;
        chatArea.appendChild(p);
        chatArea.scrollTop = chatArea.scrollHeight;
    });

    // 3. Enviar mensaje
    input.addEventListener('keypress', (e) => {
        if (e.key === 'Enter' && input.value.trim() !== '') {
            socket.emit('message', {msg: input.value, user: currentUser});
            input.value = '';
        }
    });

    // 4. Gestión de Pestañas
    function showTab(tabName) {
        document.querySelectorAll('.tab-content').forEach(tab => tab.classList.add('hidden'));
        document.getElementById(tabName + '-tab').classList.remove('hidden');
    }
</script>

</body>
</html>
