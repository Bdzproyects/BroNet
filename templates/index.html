<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BroNet - Arquitectura Anas</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #2c2f33; color: white; margin: 0; display: flex; height: 100vh; }
        #sidebar { width: 200px; background-color: #23272a; padding: 20px; border-right: 1px solid #444; }
        #main-content { flex-grow: 1; padding: 20px; display: flex; flex-direction: column; }
        .tab-button { display: block; width: 100%; padding: 10px; margin-bottom: 10px; background: #7289da; border: none; color: white; cursor: pointer; border-radius: 5px; text-align: left; }
        .tab-button:hover { background: #5b6eae; }
        #chat-area { flex-grow: 1; overflow-y: auto; background: #36393f; padding: 15px; border-radius: 8px; margin-bottom: 10px; }
        #message-input { width: 100%; padding: 10px; border-radius: 5px; border: none; background: #40444b; color: white; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div id="sidebar">
    <h2>BroNet</h2>
    <button class="tab-button" onclick="showTab('chat')">💬 Chat Principal</button>
    <button class="tab-button" onclick="showTab('brols')">🔥 Brols (Videos)</button>
    <button class="tab-button" onclick="showTab('perfil')">👤 Mi Perfil</button>
</div>

<div id="main-content">
    <div id="chat-tab">
        <h3>Canal de Chat</h3>
        <div id="chat-area">
            <p><strong>Root:</strong> Bienvenido a BroNet, Anas. El sistema está listo.</p>
        </div>
        <input type="text" id="message-input" placeholder="Escribe un mensaje aquí...">
    </div>

    <div id="brols-tab" class="hidden">
        <h3>Brols - Videos sin Copyright</h3>
        <p>Aquí se cargarán los videos cortos...</p>
        <!-- Aquí irá el reproductor de video más adelante -->
    </div>
</div>

<script>
    const socket = io();

    function showTab(tabName) {
        document.getElementById('chat-tab').classList.add('hidden');
        document.getElementById('brols-tab').classList.add('hidden');
        document.getElementById(tabName + '-tab').classList.remove('hidden');
    }

    // Lógica para enviar mensajes (la terminaremos en el siguiente paso)
    const input = document.getElementById('message-input');
    input.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            const msg = input.value;
            socket.emit('message', {msg: msg, user: 'Anas'});
            input.value = '';
        }
    });
</script>

</body>
</html>
